stages:
  - build

workflow:
  rules:
    - if: $CI_COMMIT_BRANCH == "trunk"
    - if: $CI_PIPELINE_SOURCE == "web"

variables:
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_SUBMODULE_DEPTH: 1
  PUB_CACHE: $CI_PROJECT_DIR/.cache/pub
  GRADLE_USER_HOME: $CI_PROJECT_DIR/.cache/gradle
  CARGO_HOME: $CI_PROJECT_DIR/.cache/cargo
  RUSTUP_HOME: $CI_PROJECT_DIR/.cache/rustup
  FLUTTER_VERSION: 3.50.0
  FLUTTER_SHA256: 6ea2d806fd57269ae783e6788e2a81fc26eaad782f1e0d0ff38623bb765ff9f5

.android:
  stage: build
  image: ghcr.io/cirruslabs/flutter:stable
  before_script:
    - |
      flutter_dir="$CI_PROJECT_DIR/.cache/flutter-$FLUTTER_VERSION"
      if [ ! -x "$flutter_dir/bin/flutter" ]; then
        curl -fsSL -o /tmp/flutter.tar.xz "https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
        echo "$FLUTTER_SHA256  /tmp/flutter.tar.xz" | sha256sum -c -
        mkdir -p "$flutter_dir" && tar -xJf /tmp/flutter.tar.xz -C "$flutter_dir" --strip-components=1
      fi
      git config --global --add safe.directory "$flutter_dir"
    - export PATH="$CI_PROJECT_DIR/.cache/flutter-$FLUTTER_VERSION/bin:$PATH"
    - flutter --version
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable
    - source "$CARGO_HOME/env"
    - rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android
    - (cd fluxer && rustup toolchain install && rustup target add aarch64-linux-android armv7-linux-androideabi x86_64-linux-android)
    - flutter config --enable-native-assets
    - |
      if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
        echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$CI_PROJECT_DIR/upload-keystore.jks"
        printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=%s\n' \
          "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_PASSWORD" "$ANDROID_KEY_ALIAS" \
          "$CI_PROJECT_DIR/upload-keystore.jks" > android/key.properties
      else
        echo "ANDROID_KEYSTORE_BASE64 not set: APK is signed with the debug key"
      fi
  script:
    - >-
      BUILD_NUMBER="$CI_PIPELINE_IID"
      FLUTTER_BUILD_ARGS="--split-per-abi --target-platform android-arm,android-arm64"
      whitelabel/build.sh "$CTX" apk
    - |
      for abi in arm64-v8a armeabi-v7a; do
        apk="build/app/outputs/flutter-apk/app-$abi-stableunifiedpush-release.apk"
        ls -lh "$apk"
        curl --fail-with-body --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$apk" \
          "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/meine-$CTX-android/$CI_PIPELINE_IID/meine-$CTX-$abi.apk"
      done

android:pdl:
  extends: .android
  variables:
    CTX: pdl

android:ljs:
  extends: .android
  variables:
    CTX: ljs
